name: Verify publication

on:
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * 3'

permissions:
  contents: read

jobs:
  pages:
    name: Compare published Pages bytes
    if: github.ref == 'refs/heads/main' && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm run verify:pages

  civitai:
    name: Compare hosted Civitai build
    if: github.ref == 'refs/heads/main' && toJSON(github.event.repository.private) == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:site
      - run: node scripts/verify-civitai-live.mjs --current
